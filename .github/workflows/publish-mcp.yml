# Publish @smallwebco/tinypivot-mcp to npm and the Official MCP Registry using OIDC.
# No npm token, no MCP Registry PAT, and no two-factor prompt: both trust this workflow directly.
#
# One-time setup on npmjs.com (package settings for @smallwebco/tinypivot-mcp):
#   Trusted Publisher → GitHub Actions
#   Organization: Small-Web-Co · Repository: tinypivot · Workflow: publish-mcp.yml
#
# To release: `pnpm release:mcp <patch|minor|major|x.y.z>` bumps the version in the package, the
# MCP Registry entry, every agent plugin manifest and the Claude plugin's pinned npx version;
# commit, then push a tag `mcp-v<version>`. Afterwards copy the plugin files to
# Small-Web-Co/tinypivot-plugin with scripts/sync-plugin-repo.mjs and push there.
# Keep this workflow tag-only, like publish.yml.
name: Publish MCP to npm & MCP Registry

on:
  push:
    tags:
      - 'mcp-v*'

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#mcp-v}"
          package_version="$(node -p "require('./packages/mcp/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/mcp version $package_version" >&2
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test:unit

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires Node 22.14+ and npm 11.5.1+
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages the MCP bundles, then the MCP itself
        run: |
          pnpm build
          pnpm build:mcp

      - name: Pack publish artifact
        run: |
          mkdir -p "${RUNNER_TEMP}/npm-packages"
          cd packages/mcp
          pnpm pack --pack-destination "${RUNNER_TEMP}/npm-packages"
          ls -1 "${RUNNER_TEMP}/npm-packages"

      - name: Publish @smallwebco/tinypivot-mcp with OIDC
        run: npm publish "${RUNNER_TEMP}"/npm-packages/smallwebco-tinypivot-mcp-*.tgz --access public

  publish-registry:
    name: Publish to Official MCP Registry
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/bin" mcp-publisher
          chmod +x "${RUNNER_TEMP}/bin/mcp-publisher"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Wait for npm version to propagate
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./packages/mcp/package.json').version")"
          echo "Waiting for @smallwebco/tinypivot-mcp@${pkg_version} on npm..."
          for attempt in $(seq 1 36); do
            if curl -fsS "https://registry.npmjs.org/@smallwebco%2ftinypivot-mcp/${pkg_version}" >/dev/null 2>&1; then
              echo "Confirmed @smallwebco/tinypivot-mcp@${pkg_version} on npm (attempt ${attempt}); pausing 10s."
              sleep 10
              exit 0
            fi
            echo "Not visible yet (attempt ${attempt}/36); retrying in 10s..."
            sleep 10
          done
          echo "Timed out waiting for @smallwebco/tinypivot-mcp@${pkg_version} to appear on npm." >&2
          exit 1

      - name: Publish to Official MCP Registry via GitHub OIDC
        run: |
          set -euo pipefail
          cd packages/mcp
          mcp-publisher login github-oidc
          mcp-publisher publish
