<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- TinyPivot mark: a 3×3 pivot grid. Header row and row labels in ink, one highlighted cell in orange. -->
  <rect width="32" height="32" fill="#ece7dc"/>
  <g fill="#111111">
    <rect x="12.5" y="3.5" width="7" height="7"/>
    <rect x="21.5" y="3.5" width="7" height="7"/>
    <rect x="3.5" y="12.5" width="7" height="7"/>
    <rect x="3.5" y="21.5" width="7" height="7"/>
  </g>
  <g fill="#111111" fill-opacity="0.22">
    <rect x="3.5" y="3.5" width="7" height="7"/>
    <rect x="12.5" y="12.5" width="7" height="7"/>
    <rect x="12.5" y="21.5" width="7" height="7"/>
    <rect x="21.5" y="21.5" width="7" height="7"/>
  </g>
  <rect x="21.5" y="12.5" width="7" height="7" fill="#e8502a"/>
</svg>
